apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-chino
  namespace: elchino
  labels:
    app: front-chino
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-chino
  template:
    metadata:
      labels:
        app: front-chino
    spec:
      containers:
        - name: front-chino
          image: front-chino:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
