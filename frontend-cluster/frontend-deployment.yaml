apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: luis-felipe-09-namespace
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: luisfelipe1432/frontend-nosql:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: API_PROXY_TARGET
              value: "http://54.221.239.210:30001"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
